name: CI

on:
  push:
    branches: [ main, feature/laboratorio-testing-obligatorio, feature/laboratorio-testing-opcional ]
  pull_request:
    branches: [ main, feature/laboratorio-testing-obligatorio, feature/laboratorio-testing-opcional ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run type check
      run: npm run type-check

    - name: Run unit tests
      run: npm test -- --run

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Install Cypress
      run: npx cypress install

    - name: Build project
      run: npm run build

    - name: Start dev server
      run: |
        npx vite --host 0.0.0.0 --port 5173 > /dev/null 2>&1 &
        echo $! > server.pid
      env:
        CI: true

    - name: Wait for server to be ready
      run: |
        echo "Waiting for server to start..."
        n=0
        until curl -f http://localhost:5173 > /dev/null 2>&1 || [ $n -ge 30 ]; do
          sleep 2
          n=$((n+1))
        done
        if [ $n -ge 30 ]; then
          echo "Server failed to start"
          exit 1
        fi
        echo "Server is ready!"
        # Give it a bit more time to fully initialize
        sleep 3
        # Verify server is actually serving content
        curl -f http://localhost:5173 || (echo "Server health check failed" && exit 1)

    - name: Run Cypress tests
      run: npm run test:cypress:ci
      continue-on-error: false
      env:
        CYPRESS_baseUrl: http://localhost:5173

    - name: Run Playwright tests
      run: npm run test:playwright:ci
      continue-on-error: false
      env:
        CI: true

    - name: Stop dev server
      if: always()
      run: |
        if [ -f server.pid ]; then
          kill $(cat server.pid) || true
        fi
        pkill -f "vite" || true
